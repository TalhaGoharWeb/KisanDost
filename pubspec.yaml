name: kisan_dost
description: "A simple digital farming diary for Pakistani farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  intl: ^0.19.0
  uuid: ^4.5.3
  pdf: ^3.11.3
  printing: ^5.14.3
  shared_preferences: ^2.5.3
  lottie: ^3.3.1
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/lottie/

  fonts:
    - family: Jameel Noori Nastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeqRegular.ttf
