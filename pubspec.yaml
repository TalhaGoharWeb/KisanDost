name: kisan_dost
description: "A simple digital farming diary for Pakistani farmers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.0
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  intl: ^0.20.2
  uuid: ^4.5.3
  pdf: ^3.11.3
  printing: ^5.14.3
  shared_preferences: ^2.5.3
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4
  crypto: ^3.0.7
  share_plus: ^12.0.2
  file_picker: ^11.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Jameel Noori Nastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeqRegular.ttf
    # Noto Sans (SIL Open Font License 1.1) — numeric font: all money and
    # quantity figures render through DigitText in this family with tabular
    # figures, because Jameel Noori Nastaleeq's digits are hard to scan.
    # Non-Latin characters fall back to Nastaleeq via DigitText's
    # fontFamilyFallback, so "1,250 روپے" keeps its Urdu word styled.
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
